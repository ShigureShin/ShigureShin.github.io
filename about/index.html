<!DOCTYPE html><!--
所有页面的 HTML 骨架
    - 防闪烁主题切换脚本（在页面渲染前执行）
    - 引入全局 CSS
    - `<slot />` 插槽供子页面填充内容
--><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>关于</title><meta name="description" content="关于"><!--
      网站图标
      - SVG（主）：现代浏览器优先，支持主题色/动画/高分辨率无损缩放
      - ICO（回退）：老旧浏览器（IE / 旧 Edge）不支持 SVG favicon
      浏览器选择规则：type="image/svg+xml" 声明优先级，不支持的自动跳到 ico
    --><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="alternate icon" href="/favicon.ico"><meta name="astro-view-transitions-enabled" content="true"><meta name="astro-view-transitions-fallback" content="animate"><script type="module" src="/_astro/ClientRouter.astro_astro_type_script_index_0_lang.jmhnZfFy.js"></script><!--
      防闪烁主题切换：同步 inline 脚本，在页面渲染前设置 data-theme
      只在首次硬加载执行（is:inline 不被 Astro 处理，直接内联到 HTML）
    --><script>
      const savedTheme = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = savedTheme || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    </script><!--
      View Transitions 导航时保持主题不丢失

      问题：ClientRouter 导航时获取新页面 HTML，新页面的 <html> 带服务端默认
      data-theme（不含用户选择）。swap 替换 <html> 后主题被覆盖，is:inline
      脚本不会重新执行 → 无人从 localStorage 恢复。

      解决：监听 astro:before-swap，在 DOM swap 之前把当前主题写入新文档的 <html>。
      event.newDocument 是即将替换进来的新文档，修改它不影响当前页面。
      监听器挂在 document 上（swap 只替换 documentElement，不替换 document 本身），
      所以首次注册后永久有效。
    --><script type="module">document.addEventListener(`astro:before-swap`,e=>{let t=document.documentElement.getAttribute(`data-theme`);t&&e.newDocument.documentElement.setAttribute(`data-theme`,t)});</script><link rel="stylesheet" href="/_astro/BaseLayout.D-DT_kRs.css"><style>.loading-bar[data-astro-cid-72cpth5s]{animation:1.8s ease-in-out infinite loading-slide}@keyframes loading-slide{0%{transform:translate(-100%)}50%{transform:translate(250%)}to{transform:translate(-100%)}}
</style></head><body style="background-image: url('/background.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; min-height: 100vh;"><!-- 背景遮罩 --><!-- 深色与浅色模式调整为不同遮罩程度 --><!-- 是否渲染遮罩由 site.disableOverlay 控制（默认开启，保持阅读可读性） --><!-- 页面内容插槽 --><!-- 内容层：z-10 在遮罩之上 --><!--
        不需要 pt-X 给 navbar 占位：Navbar 自己是 sticky 元素，正常参与文档流，
        在它的源位置（body 顶部）就占满 64px 高，sticky 触发后再贴到 viewport 顶。
    --><div class="relative z-10"><!--
    全站 sticky 导航栏

    - sticky top-0 z-30：滚动时吸顶，z-30 高于内容层（默认 z-auto）
    - 普通页面：bg-base-100/80 backdrop-blur-md border-b shadow-sm → 半透背景 + 模糊 + 底边框 + 阴影
    - 首页透明模式：去掉 bg/border/shadow，按钮直接浮在背景图上（更干净）
    - h-16 (64px) + flex items-center：固定高度，items 垂直居中，不会被内容撑高

    与 BaseLayout 的关系：
    - sticky 元素本身参与 normal flow，占 64px 高度
    - 不需要在 BaseLayout 加 pt-X 占位（sticky 自己就是占位）
    - TOC 卡片 top-24 (96px) - navbar 高度 64px = 32px 上间距，匹配"小空间"
--><header class="sticky top-0 z-30 h-16 bg-base-100/80 backdrop-blur-md border-b border-base-200 shadow-sm"><nav class="max-w-6xl mx-auto px-4 h-full flex items-center justify-center gap-2"><a href="/" class="btn btn-ghost btn-sm">首页</a><a href="/blog" class="btn btn-ghost btn-sm">博客</a><a href="/tags" class="btn btn-ghost btn-sm">标签</a><a href="/search" class="btn btn-ghost btn-sm">搜索</a><a href="/about" class="btn btn-ghost btn-sm btn-active">关于</a></nav></header><main class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-8"><div class="relative w-full max-w-4xl overflow-hidden rounded-3xl shadow-2xl border border-white/20" data-astro-cid-72cpth5s><img src="/empty_background.jpg" alt="时雨打扫中" class="w-full block" data-astro-cid-72cpth5s><div class="absolute inset-y-0 left-0 w-[37%] flex flex-col items-center justify-center gap-6" data-astro-cid-72cpth5s><p class="text-2xl md:text-3xl font-bold tracking-[0.2em] text-gray-700" data-astro-cid-72cpth5s>时雨打扫中</p><div class="w-3/4 max-w-[200px] h-1.5 rounded-full bg-gray-300/50 overflow-hidden" data-astro-cid-72cpth5s><div class="loading-bar h-full w-2/5 rounded-full bg-gray-500" data-astro-cid-72cpth5s></div></div></div></div></main></div><!-- 主题切换按钮 --><!-- 主题切换组件 --><button id="theme-toggle" class="btn btn-ghost btn-circle fixed top-4 right-4 z-50" aria-label="切换主题"><!-- 深色模式下显示太阳（点击切回浅色） --><svg width="1em" height="1em" class="w-5 h-5 hidden dark:block" data-icon="lucide:sun"><symbol id="ai:lucide:sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></g></symbol><use href="#ai:lucide:sun"></use></svg><!-- 浅色模式下显示月亮（点击切到深色） --><svg width="1em" height="1em" class="w-5 h-5 block dark:hidden" data-icon="lucide:moon"><symbol id="ai:lucide:moon" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></symbol><use href="#ai:lucide:moon"></use></svg></button><script type="module">function e(){let e=document.documentElement,t=e.getAttribute(`data-theme`)===`dark`?`light`:`dark`;e.setAttribute(`data-theme`,t),localStorage.setItem(`theme`,t)}function t(){document.getElementById(`theme-toggle`)?.addEventListener(`click`,e)}t(),document.addEventListener(`astro:page-load`,t);</script></body></html>
