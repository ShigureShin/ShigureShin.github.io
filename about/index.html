    --><script>

      View Transitions 导航时保持主题不丢失

      问题：ClientRouter 导航时获取新页面 HTML，新页面的 <html> 带服务端默认
      data-theme（不含用户选择）。swap 替换 <html> 后主题被覆盖，is:inline

      解决：监听 astro:before-swap，在 DOM swap 之前把当前主题写入新文档的 <html>。
